<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#2b3532" />
  <title>JÉEN Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- login -->
  <section class="login" id="login" hidden>
    <form class="login__card" id="login-form">
      <div class="login__mark">JÉEN</div>
      <p class="muted">Admin portal</p>
      <label>Password<input type="password" name="password" autocomplete="current-password" required autofocus /></label>
      <button class="btn" type="submit">Log in</button>
      <p class="login__error" id="login-error" role="alert"></p>
    </form>
  </section>

  <!-- app -->
  <div class="shell" id="shell" hidden>
    <aside class="side">
      <div class="side__brand">JÉEN <span>Admin</span></div>
      <nav class="side__nav" aria-label="Admin">
        <a href="#overview" data-view="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6V11h-6zM4 20h6v-4H4zM14 7h6V4h-6z"/></svg><span>Overview</span></a>
        <a href="#bookings" data-view="bookings"><svg viewBox="0 0 24 24"><path d="M5 5h14v15H5zM5 9h14M9 3v4M15 3v4"/></svg><span>Bookings</span><b class="badge" id="badge-new" hidden></b></a>
        <a href="#calendar" data-view="calendar"><svg viewBox="0 0 24 24"><path d="M4 5h16v15H4zM4 10h16M9 10v10M14 10v10M4 15h16"/></svg><span>Calendar</span></a>
        <a href="#villas" data-view="villas"><svg viewBox="0 0 24 24"><path d="M4 20V10l8-6 8 6v10h-5v-6H9v6z"/></svg><span>Villas</span></a>
        <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Settings</span></a>
      </nav>
      <div class="side__foot">
        <a href="/" target="_blank" rel="noopener">View site ↗</a>
        <button class="linkbtn" id="logout">Log out</button>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <dialog class="dialog" id="dialog"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="admin.js"></script>
</body>
</html>
